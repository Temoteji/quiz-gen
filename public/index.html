<!DOCTYPE html>
<html lang="en" class="antialiased selection:bg-crimson-main selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes → Quiz</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            charcoal: {
              950: '#0a0a0a',
              900: '#121212',
              800: '#1a1a1a',
              700: '#2a2a2a',
              600: '#404040'
            },
            crimson: {
              main: '#8b1818',
              hover: '#731414',
              muted: '#3f0f0f'
            }
          },
          boxShadow: {
            'glow': '0 0 20px -5px rgba(139, 24, 24, 0.4)',
            'glow-hover': '0 0 25px -2px rgba(139, 24, 24, 0.5)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-charcoal-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-charcoal-900 to-charcoal-950 text-gray-300 font-sans min-h-screen flex justify-center items-start p-4 md:p-8">

  <div class="w-full max-w-2xl mt-4 md:mt-10">
    
    <!-- Header -->
    <header class="mb-10 flex flex-col items-center text-center">
      <div class="w-12 h-12 bg-charcoal-900 border border-charcoal-800 rounded-2xl shadow-xl flex items-center justify-center mb-5">
        <svg class="w-6 h-6 text-crimson-main" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-gray-100">
        Quiz Generator
      </h1>
      <p class="text-charcoal-600 text-sm mt-2 font-medium tracking-wide">by Teji</p>
    </header>

    <!-- MAIN INPUT SHEET -->
    <div id="inputSheet" class="bg-charcoal-900/60 backdrop-blur-xl border border-charcoal-800 rounded-[2rem] p-6 md:p-10 shadow-2xl shadow-black/50">
      
      <!-- Segmented Mode Control -->
      <div class="flex p-1.5 bg-charcoal-950 border border-charcoal-800 rounded-2xl w-full md:w-fit mx-auto mb-8">
        <button type="button" id="tabText" class="flex-1 md:flex-none px-6 py-2.5 text-sm font-medium text-gray-100 bg-charcoal-800 rounded-xl shadow-sm transition-all focus:outline-none">
          Text Input
        </button>
        <button type="button" id="tabFile" class="flex-1 md:flex-none px-6 py-2.5 text-sm font-medium text-charcoal-600 hover:text-gray-300 rounded-xl transition-all focus:outline-none">
          File Upload
        </button>
      </div>

      <!-- Text Panel -->
      <div id="panelText" class="block">
        <label for="notesInput" class="sr-only">Source Material</label>
        <textarea id="notesInput" class="w-full h-64 bg-charcoal-950/50 border border-charcoal-800 rounded-2xl p-6 text-sm text-gray-200 focus:outline-none focus:ring-1 focus:ring-crimson-main focus:border-crimson-main resize-y transition-all placeholder-charcoal-700" placeholder="Input source material here for synthesis..."></textarea>
      </div>

      <!-- File Panel -->
      <div id="panelFile" class="hidden">
        <div id="dropZone" class="border border-dashed border-charcoal-700 rounded-2xl p-12 text-center cursor-pointer hover:border-crimson-main hover:bg-crimson-main/5 transition-all duration-300 group">
          <div class="w-14 h-14 bg-charcoal-950 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-charcoal-800 group-hover:border-crimson-main/50 transition-colors">
            <svg class="h-6 w-6 text-charcoal-600 group-hover:text-crimson-main transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
          </div>
          <span id="dropZoneText" class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors">Select or drop file<br><span class="text-xs font-normal text-charcoal-600 mt-2 block">Supported: JPG, PNG, PDF (Max 10MB)</span></span>
          <input type="file" id="fileInput" class="hidden" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf">
        </div>
        
        <div id="fileChip" class="hidden items-center justify-between bg-charcoal-950/50 border border-charcoal-800 rounded-2xl p-4 mt-4">
          <div class="flex items-center overflow-hidden">
            <div class="w-8 h-8 bg-charcoal-800 rounded-lg flex items-center justify-center mr-4 shrink-0">
              <svg class="w-4 h-4 text-crimson-main" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            </div>
            <span id="fileName" class="text-sm font-medium text-gray-300 truncate"></span>
          </div>
          <button type="button" id="removeFileBtn" class="text-charcoal-600 hover:text-gray-200 hover:bg-charcoal-800 rounded-lg p-2 transition-all shrink-0 ml-4" title="Remove file" aria-label="Remove file">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <img id="filePreview" class="hidden w-full max-h-72 object-contain rounded-2xl mt-4 border border-charcoal-800 bg-charcoal-950/50 p-2" alt="File preview">
      </div>

      <!-- Actions -->
      <div class="flex flex-col md:flex-row items-center justify-between mt-8 gap-4">
        <p class="hidden text-sm font-medium text-charcoal-600 animate-pulse" id="status">Executing generation protocol...</p>
        <button id="generateBtn" class="ml-auto w-full md:w-auto px-8 py-3.5 bg-crimson-main hover:bg-crimson-hover text-white text-sm font-medium rounded-xl shadow-glow hover:shadow-glow-hover transition-all duration-300 active:scale-[0.98] focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
          Generate Quiz
        </button>
      </div>
      
      <!-- Error State -->
      <div id="errorMsg" class="hidden mt-6 p-4 bg-red-950/20 border border-red-900/30 rounded-2xl flex items-center">
        <svg class="w-5 h-5 text-red-500 mr-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        <p class="text-sm text-red-400"></p>
      </div>
    </div>

    <!-- QUIZ CARD -->
    <div class="hidden bg-charcoal-900/60 backdrop-blur-xl border border-charcoal-800 rounded-[2rem] p-6 md:p-10 shadow-2xl shadow-black/50" id="quizCard">
      <div class="flex items-center justify-between mb-8">
        <div class="text-xs font-mono tracking-widest text-crimson-main uppercase px-3 py-1.5 bg-crimson-main/10 rounded-lg border border-crimson-main/20" id="qnum">Q 01/10</div>
        <div class="text-xs font-mono text-gray-400 px-3 py-1.5 bg-charcoal-950 rounded-lg border border-charcoal-800" id="scoreLabel">Score: 0/0</div>
      </div>
      
      <h2 class="text-lg md:text-xl font-medium text-gray-100 mb-8 leading-relaxed" id="qtext"></h2>
      
      <div id="optionsWrap" class="space-y-3"></div>
      
      <div class="hidden mt-8 p-5 bg-charcoal-950 border border-charcoal-800 rounded-2xl text-gray-400 text-sm leading-relaxed relative overflow-hidden" id="explain">
        <div class="absolute left-0 top-0 bottom-0 w-1 bg-crimson-main"></div>
        <span id="explainText"></span>
      </div>
      
      <div class="flex justify-end mt-10">
        <button id="nextBtn" class="hidden w-full md:w-auto px-8 py-3 bg-charcoal-800 hover:bg-charcoal-700 text-gray-100 text-sm font-medium rounded-xl transition-all duration-300 active:scale-[0.98] focus:outline-none">Proceed</button>
      </div>
    </div>

    <!-- DONE CARD -->
    <div class="hidden bg-charcoal-900/60 backdrop-blur-xl border border-charcoal-800 rounded-[2rem] p-12 shadow-2xl shadow-black/50 text-center" id="doneCard">
      <div class="w-20 h-20 border-2 border-charcoal-800 rounded-3xl flex items-center justify-center mx-auto mb-6 bg-charcoal-950 shadow-glow">
        <svg class="w-8 h-8 text-crimson-main" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-2xl font-semibold text-gray-100 mb-3">Evaluation Complete</h2>
      <p class="text-charcoal-600 text-sm font-medium tracking-wide mb-10" id="doneText"></p>
      <button id="restartBtn" class="px-8 py-3.5 bg-charcoal-800 hover:bg-charcoal-700 text-gray-100 text-sm font-medium rounded-xl transition-all duration-300 active:scale-[0.98] focus:outline-none">Initialize New Session</button>
    </div>

  </div>

<script>
let quiz = [];
let current = 0;
let score = 0;
let answered = 0;

const notesInput = document.getElementById('notesInput');
const generateBtn = document.getElementById('generateBtn');
const tabText = document.getElementById('tabText');
const tabFile = document.getElementById('tabFile');
const panelText = document.getElementById('panelText');
const panelFile = document.getElementById('panelFile');
const dropZone = document.getElementById('dropZone');
const dropZoneText = document.getElementById('dropZoneText');
const fileInput = document.getElementById('fileInput');
const fileChip = document.getElementById('fileChip');
const fileName = document.getElementById('fileName');
const filePreview = document.getElementById('filePreview');
const removeFileBtn = document.getElementById('removeFileBtn');

let mode = 'text';
let selectedFile = null;
const statusEl = document.getElementById('status');
const errorContainer = document.getElementById('errorMsg');
const errorText = errorContainer.querySelector('p');
const inputSheet = document.getElementById('inputSheet');
const quizCard = document.getElementById('quizCard');
const doneCard = document.getElementById('doneCard');
const qnum = document.getElementById('qnum');
const qtext = document.getElementById('qtext');
const optionsWrap = document.getElementById('optionsWrap');
const explainContainer = document.getElementById('explain');
const explainText = document.getElementById('explainText');
const nextBtn = document.getElementById('nextBtn');
const scoreLabel = document.getElementById('scoreLabel');
const restartBtn = document.getElementById('restartBtn');

// Architectural classes for quiz interface
const classTabActive = 'flex-1 md:flex-none px-6 py-2.5 text-sm font-medium text-gray-100 bg-charcoal-800 rounded-xl shadow-sm transition-all focus:outline-none';
const classTabInactive = 'flex-1 md:flex-none px-6 py-2.5 text-sm font-medium text-charcoal-600 hover:text-gray-300 rounded-xl transition-all focus:outline-none';
const classOptBase = 'w-full text-left px-6 py-4 border border-charcoal-800 rounded-2xl hover:border-charcoal-600 hover:bg-charcoal-800/50 transition-all duration-300 bg-charcoal-950/50 text-gray-300 text-sm font-medium focus:outline-none active:scale-[0.99]';
const classOptCorrect = 'w-full text-left px-6 py-4 border border-emerald-900/50 bg-emerald-950/20 text-emerald-400 rounded-2xl text-sm font-medium shadow-[0_0_20px_rgba(4,120,87,0.1)] transition-all';
const classOptWrong = 'w-full text-left px-6 py-4 border border-crimson-main/30 bg-crimson-muted/20 text-red-400 rounded-2xl text-sm font-medium shadow-[0_0_20px_rgba(139,24,24,0.1)] transition-all';

generateBtn.addEventListener('click', generateQuiz);
nextBtn.addEventListener('click', showNext);
restartBtn.addEventListener('click', resetAll);

tabText.addEventListener('click', () => switchMode('text'));
tabFile.addEventListener('click', () => switchMode('file'));
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));
removeFileBtn.addEventListener('click', clearFile);

['dragover', 'dragenter'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { 
    e.preventDefault(); 
    dropZone.classList.add('border-crimson-main', 'bg-charcoal-900/80'); 
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { 
    e.preventDefault(); 
    dropZone.classList.remove('border-crimson-main', 'bg-charcoal-900/80'); 
  });
});
dropZone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleFileSelect(e.dataTransfer.files[0]);
  }
});

function switchMode(newMode){
  mode = newMode;
  
  tabText.className = mode === 'text' ? classTabActive : classTabInactive;
  tabFile.className = mode === 'file' ? classTabActive : classTabInactive;
  
  panelText.style.display = mode === 'text' ? 'block' : 'none';
  panelFile.style.display = mode === 'file' ? 'block' : 'none';
  
  errorContainer.style.display = 'none';
}

function handleFileSelect(file){
  if (!file) return;
  const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'application/pdf'];
  
  if (!allowed.includes(file.type)) {
    errorText.textContent = 'Exception: Unsupported format detected.';
    errorContainer.style.display = 'flex';
    return;
  }
  
  if (file.size > 10 * 1024 * 1024) {
    errorText.textContent = 'Exception: Payload exceeds 10MB limit.';
    errorContainer.style.display = 'flex';
    return;
  }
  
  selectedFile = file;
  errorContainer.style.display = 'none';
  fileName.textContent = file.name;
  fileChip.style.display = 'flex';
  dropZone.style.display = 'none';

  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = (e) => {
      filePreview.src = e.target.result;
      filePreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  } else {
    filePreview.style.display = 'none';
  }
}

function clearFile(){
  selectedFile = null;
  fileInput.value = '';
  fileChip.style.display = 'none';
  filePreview.style.display = 'none';
  filePreview.src = '';
  dropZone.style.display = 'block';
}

async function generateQuiz(){
  errorContainer.style.display = 'none';

  let fetchPromise;

  if (mode === 'text') {
    const notes = notesInput.value.trim();
    if(notes.length < 30){
      errorText.textContent = 'Exception: Insufficient data parameters for synthesis.';
      errorContainer.style.display = 'flex';
      return;
    }
    fetchPromise = fetch('/api/generate-quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes })
    });
  } else {
    if (!selectedFile) {
      errorText.textContent = 'Exception: No valid payload selected.';
      errorContainer.style.display = 'flex';
      return;
    }
    const formData = new FormData();
    formData.append('file', selectedFile);
    fetchPromise = fetch('/api/generate-quiz-file', {
      method: 'POST',
      body: formData
    });
  }

  generateBtn.disabled = true;
  statusEl.style.display = 'block';

  try {
    const response = await fetchPromise;
    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'Connection exception during processing.');
    }

    quiz = data.quiz;
    current = 0;
    score = 0;
    answered = 0;
    inputSheet.style.display = 'none';
    quizCard.style.display = 'block';
    renderQuestion();
  } catch (err) {
    console.error('API Error:', err);
    errorText.textContent = err.message || 'Exception: API communication failed.';
    errorContainer.style.display = 'flex';
  } finally {
    generateBtn.disabled = false;
    statusEl.style.display = 'none';
  }
}

function renderQuestion(){
  const q = quiz[current];
  const qIndex = (current + 1).toString().padStart(2, '0');
  const qTotal = quiz.length.toString().padStart(2, '0');
  
  qnum.textContent = `Q ${qIndex}/${qTotal}`;
  qtext.textContent = q.question;
  explainContainer.style.display = 'none';
  nextBtn.style.display = 'none';
  optionsWrap.innerHTML = '';

  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = classOptBase;
    b.textContent = opt;
    b.addEventListener('click', () => selectAnswer(i));
    optionsWrap.appendChild(b);
  });
  updateScore();
}

function selectAnswer(i){
  const q = quiz[current];
  const buttons = optionsWrap.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  buttons[i].className = (i === q.correctIndex) ? classOptCorrect : classOptWrong;
  
  if(i !== q.correctIndex){
    buttons[q.correctIndex].className = classOptCorrect;
  } else {
    score++;
  }
  
  answered++;
  explainText.textContent = q.explanation || '';
  explainContainer.style.display = 'block';
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = current === quiz.length - 1 ? 'End Assessment' : 'Proceed';
  updateScore();
}

function updateScore(){
  scoreLabel.textContent = `Score: ${score}/${answered}`;
}

function showNext(){
  if(current === quiz.length - 1){
    quizCard.style.display = 'none';
    doneCard.style.display = 'block';
    document.getElementById('doneText').textContent =
      `FINAL SCORE: ${score}/${quiz.length}. ${score === quiz.length ? "EVALUATION: Very Good." : "EVALUATION: Good. REVIEW REQUIRED."}`;
  } else {
    current++;
    renderQuestion();
  }
}

function resetAll(){
  notesInput.value = '';
  clearFile();
  doneCard.style.display = 'none';
  inputSheet.style.display = 'block';
}
</script>
</body>
</html>
